<!doctype html>
<!--
  Generated by build.py from content.md and presets.yaml. Don't edit the generated pages: change content.md
  (text and images) or this template (page structure), then run `python build.py`.
-->
<html lang="en-GB" class="no-js" data-palette="$palette">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$title</title>
<meta name="description" content="$description">
$robots
<meta name="theme-color" content="#12110f">
<script>
  (function () {
    var d = document.documentElement, ids = "$palette_ids".split(",");
    d.className = d.className.replace("no-js", "js");
    if ($picker_on) {
      try { var p = localStorage.getItem("pf-palette"); if (p && ids.indexOf(p) > -1) d.setAttribute("data-palette", p); } catch (e) {}
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=$css_v">
<style>
$palette_css
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="mast">
  <div class="wrap">
    <a class="title" href="#about">$mast_name</a>
    <nav aria-label="Sections">$nav</nav>
  </div>
</header>

<main id="main">
$cover
$chapters
$cv
</main>
$footer

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="r-crumb" aria-hidden="true">
  <div class="r-bar"><div class="wrap"><span class="crumb sc" id="r-crumb"></span><button class="r-close" type="button" id="r-close">Close $close_icon</button></div></div>
  <article id="r-article"></article>
</div>
$picker

<!-- one template per project; the reader shows them -->
$templates

<script src="assets/js/site.js?v=$js_v"></script>
</body>
</html>
